{{- /* Masonry and the code that applies it to every .mosaic on the page */ -}}
{{- $masonry := resources.Get "js/vendor/masonry.pkgd.min.js" }}
{{- $init := resources.Get "js/mosaic.js" | minify }}
{{- with slice $masonry $init | resources.Concat "js/mosaic.js" | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{- end }}
