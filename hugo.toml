# baseURL is overridden by the GitHub Pages workflow
baseURL = "https://iam-peter.github.io/"
locale = "en-US"
title = "Henning Gründl"
# Keep tag names as written, "tv" rather than "Tv"
capitalizeListTitles = false

[params]
  description = "Projects and notes by Henning Gründl"
  author = "Henning Gründl"

  # Contact links in the footer; leave a value empty to hide it
  [params.contact]
    email = ""
    linkedin = ""
    mastodon = ""

  [params.github]
    user = "iam-peter"
    # Forks are hidden unless listed under include
    showForks = false
    exclude = []
    include = []

[taxonomies]
  tag = "tags"

[markup.highlight]
  noClasses = false

[[menu.main]]
  name = "Projects"
  pageRef = "/projects"
  weight = 1
[[menu.main]]
  name = "Notes"
  pageRef = "/notes"
  weight = 2
[[menu.main]]
  name = "About"
  pageRef = "/about"
  weight = 3
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/iam-peter"
  weight = 4

# Hugo caches remote resources forever by default, which would freeze the
# GitHub repository list in local builds
[caches.getresource]
  maxAge = "10m"
